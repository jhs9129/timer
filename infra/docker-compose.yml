services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: village
      POSTGRES_PASSWORD: village
      POSTGRES_DB: village
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U village -d village"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
